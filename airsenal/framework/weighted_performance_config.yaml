# Weighted Performance Metrics Configuration
# ==========================================
# 
# This configuration file defines the weight matrices used for position-specific
# performance scoring in AIrsenal. Weights are based on:
# 
# 1. FPL Scoring System: Points awarded for different actions
# 2. Positional Importance: Role-specific value of different metrics  
# 3. Historical Correlation: How well metrics predict future FPL points
# 4. Expert Analysis: Football analytics insights on positional roles
#
# All weights within a position should sum to approximately 1.0 for consistency.
# Negative weights are allowed for penalty metrics (e.g., own goals).

# ========================================
# GOALKEEPER WEIGHTS 
# ========================================
# Goalkeepers score points primarily through clean sheets (4 pts) and saves (1 pt per 3).
# Goals are rare but extremely valuable (6 pts). Penalty saves provide massive bonus.
goalkeeper_weights:
  clean_sheets: 0.35      # Primary responsibility - 4 FPL points
  saves: 0.25            # Consistent point source - 1 pt per 3 saves  
  goals: 0.15            # Rare but 6 FPL points when it happens
  assists: 0.10          # Occasional from long distribution
  bonus: 0.10            # BPS from saves, passes, sweeper actions
  penalties_saved: 0.05  # High impact but very rare occurrence

# ========================================
# DEFENDER WEIGHTS
# ========================================  
# Defenders get clean sheet points (4 pts) and high value for goals (6 pts) and assists (3 pts).
# Own goals are heavily penalized (-2 pts). Defensive actions contribute to BPS.
defender_weights:
  clean_sheets: 0.30     # Core defensive metric - 4 FPL points
  goals: 0.25           # Very valuable - 6 FPL points each
  assists: 0.20         # Good value - 3 FPL points each  
  bonus: 0.15           # From tackles, interceptions, clearances
  own_goals: -0.10      # Penalty metric - minus 2 FPL points

# ========================================
# MIDFIELDER WEIGHTS
# ========================================
# Midfielders get balanced scoring from goals (5 pts) and assists (3 pts).
# Clean sheet bonus (1 pt) provides consistent base. Set piece takers get boost.
midfielder_weights:
  goals: 0.25           # 5 FPL points each - good value
  assists: 0.25         # 3 FPL points each - consistent opportunity
  bonus: 0.20           # ICT index contributions from all-round play
  clean_sheets: 0.15    # 1 FPL point - base score for defensive midfielders
  key_passes_per_90: 0.10  # Leading indicator for future assists
  penalty_taker_boost: 0.05 # Set piece advantage - reliable points

# ========================================
# FORWARD WEIGHTS  
# ========================================
# Forwards are primarily judged on goals (4 pts) with assists secondary (3 pts).
# Shot volume indicates future goal potential. Penalty takers have significant advantage.
forward_weights:
  goals: 0.40           # Primary role - 4 FPL points each
  assists: 0.20         # Secondary contribution - 3 FPL points
  bonus: 0.20           # BPS from shots, goal threat, key passes
  penalty_taker_boost: 0.10 # Penalty opportunity - almost guaranteed points
  shots_per_90: 0.10    # Leading indicator for future goals

# ========================================
# OPPONENT DIFFICULTY ADJUSTMENTS
# ========================================
# These factors multiply base weights based on fixture difficulty rating (1-5 scale).
# Easier fixtures boost expectations, harder fixtures reduce them.
# Based on historical analysis of performance vs fixture difficulty.
difficulty_adjustments:
  1: 1.2  # Very easy fixtures (relegated teams, injury crisis) - 20% boost
  2: 1.1  # Easy fixtures (lower table opposition) - 10% boost  
  3: 1.0  # Average fixtures (mid-table) - no adjustment
  4: 0.9  # Hard fixtures (top 6 opposition) - 10% reduction
  5: 0.8  # Very hard fixtures (title contenders away) - 20% reduction

# ========================================
# METRIC NORMALIZATION RANGES
# ========================================
# Min/max values for normalizing raw metrics to 0-1 scale.
# Based on realistic match performance ranges across all FPL seasons.
normalization_ranges:
  goals: [0, 4]          # 0-4 goals per match (4 very rare but possible)
  assists: [0, 3]        # 0-3 assists per match (3+ extremely rare)
  clean_sheets: [0, 1]   # Binary metric - either kept clean sheet or not
  bonus: [0, 3]          # 0-3 bonus points per match maximum
  saves: [0, 10]         # Goalkeeper saves - 10 is very busy match
  penalties_saved: [0, 1] # Binary metric - saved penalty or not  
  own_goals: [0, 1]      # Binary metric - scored own goal or not (negative)
  key_passes_per_90: [0, 8]  # Creative players can have 6-8 key passes
  shots_per_90: [0, 8]       # Aggressive forwards can have 6-8 shots
  penalty_taker_boost: [0, 1] # Binary boost - primary penalty taker or not

# ========================================
# EXPERIMENTAL WEIGHTS
# ========================================
# Alternative weight configurations for testing and optimization.
# These can be swapped in for A/B testing different scoring approaches.

experimental_configs:
  # More conservative approach - emphasizes consistent metrics over explosive ones
  conservative:
    goalkeeper_weights:
      clean_sheets: 0.40
      saves: 0.30  
      goals: 0.10
      assists: 0.10
      bonus: 0.10
      penalties_saved: 0.00
    
    # etc...
  
  # Aggressive approach - emphasizes explosive scoring potential  
  aggressive:
    forward_weights:
      goals: 0.50       # Even heavier goal emphasis
      penalty_taker_boost: 0.15  # Premium on penalty takers
      assists: 0.15
      bonus: 0.15
      shots_per_90: 0.05
    
    # etc...

# ========================================
# WEIGHT TUNING METHODOLOGY
# ========================================
# 
# Weight Selection Process:
# 1. Base weights start from FPL point values (goals=4pts forwards, 6pts defenders, etc.)
# 2. Adjusted for positional frequency (defenders score fewer goals, so weight higher)
# 3. Validated against historical data using correlation analysis
# 4. Tuned using cross-validation on previous seasons' data
# 5. A/B tested against existing prediction models for accuracy improvement
#
# Validation Metrics:
# - Correlation with actual FPL points scored in following gameweeks
# - Prediction accuracy for top/bottom performers 
# - Transfer suggestion accuracy (did recommended players outperform?)
# - Overall model MAE (Mean Absolute Error) improvement
#
# Retuning Schedule:
# - Major retuning at start of each season (rule changes, meta shifts)
# - Minor adjustments monthly based on performance metrics
# - Emergency adjustments for major injuries/suspensions affecting roles
#
# Configuration Version: 1.0.0
# Last Updated: 2024-12-19
# Validated On: 2023-24 FPL Season Data
# Next Review: Start of 2024-25 Season